# Site settings
locale: "en-US"
title: "Chi-Jen Peng"
title_separator: "-"
name: "Chi-Jen Peng"
description: "Chi-Jen Peng: music information retrieval and generative models for music and audio."
url: https://chijenpeng.github.io
baseurl: ""
repository: "chijenpeng/chijenpeng.github.io"
timezone: Asia/Taipei

author:
  name: "Chi-Jen Peng"
  bio: "MS Student / Audio, NLP & ML Researcher / Musician / Concert-goer"
  location: "Taipei, Taiwan"
  employer: "National Taiwan University"
  email: "codyviridian@gmail.com"
  email_alt: "r14725022@ntu.edu.tw"
  github: "chijenpeng"
  linkedin: "chijenpeng"

# Build
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - _pages
  - files
exclude:
  - resume.tex
  - README.md
  - Gemfile
  - LICENSE
  - vendor
  - node_modules
  - .sass-cache
  - reports
  - research_notes
  - "*.aux"
  - "*.fls"
  - "*.fdb_latexmk"
  - "*.synctex.gz"
keep_files:
  - .git

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
